name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name : Lint with ruff
        run: |
          ruff check .
      - name: Run tests with pytest
        run: |
          pytest --maxfail=1 --disable-warnings -q
  
  pipeline:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Configure DVC remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user Borhan1997
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"
      - name: Cache DVC data
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-all-${{ hashFiles('data/processed/*.dvc') }}
          restore-keys: |
            dvc-all-
      - name: Pull data from DVC remote
        run: |
          dvc pull -v -r dagshub data/processed/test.dvc data/processed/batch_1.dvc data/processed/batch_2.dvc data/processed/batch_3.dvc
      - name: Rebuild the Train folder
        run: |
          mkdir -p data/processed/train
          cp -r data/processed/batch_1/. data/processed/train/
          cp -r data/processed/batch_2/. data/processed/train/
          cp -r data/processed/batch_3/. data/processed/train/
      - name: Train Model
        run: |
          python -m src.train --version v3
        timeout-minutes: 45
      - name: Evaluate Model
        run: |
          RUN_ID=$(python -c "import mlflow; mlflow.set_tracking_uri('sqlite:///mlflow.db'); print(mlflow.search_runs(experiment_names=['casting-defect'], order_by=['attributes.start_time DESC'], max_results=1).iloc[0]['run_id'])")
          python -m src.evaluate --run-id "$RUN_ID"
        timeout-minutes: 15
      - name: Gate check
        run: |
          set -o pipefail
          EVAL_ID=$(python -c "import mlflow; mlflow.set_tracking_uri('sqlite:///mlflow.db'); print(mlflow.search_runs(experiment_names=['casting-defect'], filter_string=\"tags.training_run_id != ''\", order_by=['attributes.start_time DESC'], max_results=1).iloc[0]['run_id'])")
          python gate/gate.py --eval-run-id "$EVAL_ID" --tracking-uri sqlite:///mlflow.db 2>&1 | tee gate_output.txt
        timeout-minutes: 5
      - name: Gate summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f gate_output.txt ]; then
            echo '## Gate result' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat gate_output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi